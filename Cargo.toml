[package]
name = "xmrsplayer"
version = "0.9.10"
edition = "2021"
description = "XMrsPlayer is a safe no-std soundtracker music player"
authors = ["Sebastien Bechet"]
documentation = "https://docs.rs/xmrsplayer"
repository = "https://codeberg.org/sbechet/xmrsplayer"

readme = "README.md"
license = "MIT"

keywords = ["xm", "mod", "s3m", "it", "soundtracker"]
categories = ["multimedia::audio", "embedded", "no-std"]

# Disable auto-discovery of examples so that `examples/bufferedsource.rs`
# (a helper module used by `rodio_player.rs` via `mod bufferedsource;`)
# is NOT compiled as a standalone example. Only the targets declared in
# `[[example]]` sections below are built.
autoexamples = false

[dependencies]
xmrs = { path = "0.9.10", default-features = false }
clap = { version = "4.5", optional = true, features = ["cargo", "derive"] }
rodio =  { version = "0.22", optional = true, features = ["playback"] }
console =  { version = "0.16", optional = true }
cpal =  { version = "0.17", optional = true }
num-traits = { version = "0.2",default-features = false, optional=true } # libm wrapper
micromath = { version = "2.1", optional=true }
hound = { version = "3.5", optional=true }

[features]
default = ["micromath"]
# The `demo` feature gates the interactive example players (cpal_player
# binary and rodio_player example). rodio is needed for rodio_player.
# To install the player binary: `cargo install xmrsplayer --features demo`.
demo = ["std", "clap", "console", "cpal", "hound", "rodio", "import", "sid"]
import = ["xmrs/import", "xmrs/import_sid"]
libm = ["num-traits/libm", "xmrs/libm"]
micromath = ["dep:micromath", "xmrs/micromath"]
sid = ["xmrs/import_sid"]
std = ["xmrs/std"]

[lib]
name = "xmrsplayer"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "xmrsplayer"
path = "src/bin/cpal_player.rs"
required-features = [ "demo" ]

# arp_bug is a pure-computation example that uses only core/std — no
# feature-gated deps needed.
[[example]]
name = "arp_bug"
path = "examples/arp_bug.rs"

# rodio_player pulls in rodio/clap/console and the xmrs import modules,
# all of which are gated by the `demo` feature.
[[example]]
name = "rodio_player"
path = "examples/rodio_player.rs"
required-features = [ "demo" ]
