[package]
name = "xmrsplayer"
version = "0.12.2"
edition = "2021"
description = "XMrsPlayer is a safe no-std soundtracker music player"
authors = ["Sebastien Bechet"]
documentation = "https://docs.rs/xmrsplayer"
repository = "https://codeberg.org/sbechet/xmrsplayer"

readme = "README.md"
license = "MIT"

keywords = ["xm", "mod", "s3m", "it", "soundtracker"]
categories = ["multimedia::audio", "embedded", "no-std"]

[dependencies]
# `xmrs` is pulled in without default features; the `std` feature (on by
# default here) re-enables it below.
xmrs = { version = "0.12.2", default-features = false }
# `clap` defaults drop the `suggestions` feature (`-Did you mean
# --foo?` typo correction) — it pulls in `strsim` for fuzzy
# string match and costs ~12 KB in the final binary while
# rarely helping a tracker-player user. Everything else is kept
# (`color`, `error-context`, …) for readable help output.
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "help", "usage", "error-context", "color", "cargo", "derive"] }
# `console`'s default features pull in `unicode-width` for
# `measure_text_width` / `truncate_str` / `pad_str` — we only use
# `Term::read_key` for the interactive keyboard and emit plain
# ANSI codes for `clear_screen()`, so we can drop both
# `unicode-width` and `ansi-parsing` (input-side ANSI parsing,
# also unused).
console = { version = "0.16", optional = true, default-features = false, features = ["std"] }
# `cpal` exposes no `default` feature group; the desktop ALSA /
# CoreAudio / WASAPI backend is wired in unconditionally. The
# optional features (`asio`, `jack`, `audioworklet`, …) target
# specific platforms and stay off by design.
cpal = { version = "0.17", optional = true }
# `hound` ships no feature flags — the default WAV reader/writer
# is the only configuration available.
hound = { version = "3.5", optional = true }

[features]
# `std` and `import` are on by default: the common case is a
# desktop/server build that wants the standard library and every
# format importer. Users targeting `no_std` or wanting a smaller
# binary opt out with `default-features = false` and pick only what
# they need.
default = ["std", "import"]

# Enable the standard library. Forwarded to `xmrs`. The crate
# compiles fully `no_std` without any extra math backend — the
# entire gain / pitch / LFO / filter chain is integer Q-format,
# and the importers no longer need `log2` / `sin` / `cos`.
#
# `xmrs/float-helpers` is still propagated so that downstream
# editors / GUIs can call `EnvValue::to_f32()` & co. on the
# desktop side; embedded users keep `default-features = false`
# to skip it.
std = ["xmrs/std", "xmrs/float-helpers"]

# `demo` gates the interactive player binary (`cpal_player.rs`) and the
# DAW-layer inspector example. It is a convenience feature that also
# turns on `std` and all importers so `--no-default-features --features
# demo` still builds.
# To install the player binary: `cargo install xmrsplayer --features demo`.
demo = ["std", "import", "clap", "console", "cpal", "hound"]

# ---- Historical-format importers (propagate to xmrs) ----
# `import` is an umbrella for all importers. Downstreams that want
# a smaller binary can disable it and pick only the formats they
# need, e.g. `features = ["std", "import_xm"]`.
import = ["xmrs/import"]
import_mod = ["xmrs/import_mod"]
import_xm  = ["xmrs/import_xm"]
import_s3m = ["xmrs/import_s3m"]
import_it  = ["xmrs/import_it"]
import_sid = ["xmrs/import_sid"]

[lib]
name = "xmrsplayer"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "xmrsplayer"
path = "src/bin/cpal_player.rs"
required-features = ["demo"]

# arp_bug is a pure-computation example that uses only core/std — no
# feature-gated deps needed.
[[example]]
name = "arp_bug"
path = "examples/arp_bug.rs"

# Read-only DAW-layer dump for chasing import-time regressions.
# Gated behind `demo` because it uses `Module::load` autodetection
# (which pulls every importer).
[[example]]
name = "inspect_mod"
path = "examples/inspect_mod.rs"
required-features = ["demo"]
